<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vertion Atendimento</title>
    <link rel="stylesheet" href="src/popup.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div>
        <p class="marca">Vertion</p>
        <h1>Respostas</h1>
      </div>
      <button type="button" id="nova" class="botao botao--principal">Nova</button>
    </header>

    <div class="sincronia">
      <div class="sincronia-texto">
        <strong id="sincronia-titulo">Biblioteca da equipe</strong>
        <span id="sincronia-status">Verificando...</span>
      </div>
      <button type="button" id="sincronizar" class="botao botao--pequeno">Atualizar</button>
    </div>

    <form id="formulario" class="formulario" hidden>
      <input type="hidden" id="campo-id" />
      <label class="campo">
        <span>Título</span>
        <input type="text" id="campo-titulo" required maxlength="60" placeholder="Quanto custa" />
      </label>
      <label class="campo">
        <span>Atalho (sem barra)</span>
        <input type="text" id="campo-atalho" required maxlength="24" placeholder="preco" />
      </label>
      <label class="campo">
        <span>Resposta</span>
        <textarea id="campo-texto" required rows="5" placeholder="Use {primeiro_nome} para chamar a pessoa pelo nome."></textarea>
      </label>
      <div class="acoes">
        <button type="submit" class="botao botao--principal">Salvar</button>
        <button type="button" id="cancelar" class="botao">Cancelar</button>
      </div>
    </form>

    <ul id="lista" class="lista"></ul>

    <footer class="rodape">
      <details class="avancado">
        <summary>Configuração avançada</summary>
        <label class="campo">
          <span>Endereço da biblioteca</span>
          <input type="url" id="campo-url" placeholder="https://..." />
        </label>
        <div class="acoes">
          <button type="button" id="salvar-url" class="botao botao--pequeno">Salvar endereço</button>
          <button type="button" id="exportar" class="botao botao--pequeno">Exportar minhas</button>
        </div>
        <p class="dica">
          A biblioteca da equipe chega sozinha pela internet. As respostas que você criar aqui
          ficam só no seu Chrome.
        </p>
      </details>
    </footer>

    <script src="src/storage.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
